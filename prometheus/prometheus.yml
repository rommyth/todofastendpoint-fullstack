global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "backend"
    scrape_native_histograms: false
    metrics_path: /metrics
    honor_labels: false
    honor_timestamps: true
    scheme: http
    follow_redirects: true
    body_size_limit: "0"
    sample_limit: 0
    label_limit: 0
    label_name_length_limit: 0
    label_value_length_limit: 0
    target_limit: 0

    static_configs:
      - targets:
          - backend-1:5030
          - backend-2:5030
